<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>题库管理 - OCS 题库管理台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="top"></div>
  <div class="container">
    <div class="row">
      <input id="q" placeholder="搜索题目关键字…" style="width:260px" />
      <button class="sm" onclick="load(0)">搜索</button>
      <span class="spacer" style="flex:1"></span>
      <span class="muted" id="total"></span>
    </div>

    <div class="panel">
      <h2>题库列表</h2>
      <div class="body">
        <table id="list"><thead>
          <tr><th>题目</th><th>类型</th><th>选项</th><th>答案</th><th>操作</th></tr>
        </thead><tbody></tbody></table>
        <div class="row" style="margin-top:14px">
          <button class="ghost sm" onclick="load(offset-20)">上一页</button>
          <span class="muted" id="pageinfo"></span>
          <button class="ghost sm" onclick="load(offset+20)">下一页</button>
        </div>
      </div>
    </div>

    <div class="panel" id="detail-panel" style="display:none">
      <h2>答案候选 / 管理 <button class="ghost sm" style="float:right" onclick="document.getElementById('detail-panel').style.display='none'">关闭</button></h2>
      <div class="body" id="detail"></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    document.getElementById("top").replaceWith(renderTopbar("questions.html"));
    let offset = 0;
    const LIMIT = 20;

    async function load(off) {
      offset = Math.max(0, off || 0);
      const q = document.getElementById("q").value.trim();
      let d;
      try { d = await api(`/api/admin/questions?limit=${LIMIT}&offset=${offset}&q=${encodeURIComponent(q)}`); }
      catch (e) { document.querySelector("#list tbody").innerHTML = `<tr><td colspan="5" class="muted">加载失败: ${e.message}</td></tr>`; return; }
      document.getElementById("total").textContent = `共 ${d.total} 题`;
      document.getElementById("pageinfo").textContent = `第 ${offset + 1}-${Math.min(offset + LIMIT, d.total)} 条`;
      const tbody = document.querySelector("#list tbody");
      tbody.innerHTML = (d.items || []).map(it => {
        const answers = (it.answers || []).map(a =>
          `${statusTag(a.status)} <span class="mono">${escapeHtml(a.answer).slice(0, 24)}</span>`).join("<br>") || `<span class="muted">无</span>`;
        return `<tr>
          <td>${escapeHtml(it.question_raw).slice(0, 60)}<div class="hint mono">${it.qkey.slice(0, 12)}…</div></td>
          <td class="muted">${it.type}</td>
          <td class="muted">${(it.options || []).map(o => escapeHtml(o)).join(" / ").slice(0, 40)}</td>
          <td>${answers}</td>
          <td>
            <button class="ghost sm" onclick='showDetail("${it.qkey}")'>管理</button>
            <button class="red sm" onclick='delQ("${it.qkey}")'>删</button>
          </td>
        </tr>`;
      }).join("") || `<tr><td colspan="5" class="muted">暂无题目（可先让 OCS 请求几道题，或运行 seed 脚本）</td></tr>`;
    }

    async function showDetail(qkey) {
      const panel = document.getElementById("detail-panel");
      const d = await api(`/api/admin/answers?qkey=${qkey}`);
      panel.style.display = "block";
      const items = d.items || [];
      document.getElementById("detail").innerHTML = `
        <div class="hint">qkey: <span class="mono">${qkey}</span></div>
        <table><thead><tr><th>答案</th><th>状态</th><th>来源</th><th>置信度</th><th>命中</th><th>操作</th></tr></thead>
        <tbody>${items.map(a => `<tr>
          <td>${escapeHtml(a.answer)}</td>
          <td>${statusTag(a.status)}</td>
          <td>${statusTag(a.source === "store" ? "store" : "llm")}</td>
          <td class="muted">${a.confidence}</td>
          <td class="muted">${a.hit_count}</td>
          <td>
            ${a.status !== "trusted" ? `<button class="green sm" onclick="promote(${a.id})">设为可信</button>` : ""}
            ${a.status === "trusted" ? `<button class="ghost sm" onclick="demote(${a.id})">降为候选</button>` : ""}
          </td>
        </tr>`).join("") || `<tr><td colspan="6" class="muted">无答案</td></tr>`}</tbody></table>
        <div class="row" style="margin-top:12px">
          <input id="new-ans" placeholder="手动添加候选答案…" style="width:320px" />
          <label class="muted"><input type="checkbox" id="new-trusted" /> 直接设为可信</label>
          <button class="sm" onclick='addCandidate("${qkey}")'>添加</button>
        </div>`;
    }

    async function promote(id) { await api(`/api/admin/answers/${id}/promote`, { method: "POST" }); refreshDetail(); }
    async function demote(id) { await api(`/api/admin/answers/${id}/demote`, { method: "POST" }); refreshDetail(); }
    let currentQkey = null;
    async function refreshDetail() { if (currentQkey) { await load(offset); await showDetail(currentQkey); } }

    // 包装 showDetail 记录当前 qkey
    const _show = showDetail;
    showDetail = async function (qkey) { currentQkey = qkey; return _show(qkey); };

    async function addCandidate(qkey) {
      const ans = document.getElementById("new-ans").value.trim();
      if (!ans) return;
      const trusted = document.getElementById("new-trusted").checked;
      await api(`/api/admin/answers/${qkey}/candidate`, {
        method: "POST",
        body: JSON.stringify({ answer: ans, make_trusted: trusted, confidence: 1.0 }),
      });
      refreshDetail();
    }

    async function delQ(qkey) {
      if (!confirm("确认删除该题目及其答案？")) return;
      await api(`/api/admin/questions/${qkey}`, { method: "DELETE" });
      load(offset);
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    load(0);
  </script>
</body>
</html>
