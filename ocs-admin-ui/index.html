<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>仪表盘 - OCS 题库管理台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="top"></div>
  <div class="container">
    <div class="banner" id="svc-banner">正在获取服务状态…</div>
    <div class="cards" id="cards"></div>

    <div class="panel">
      <h2>最近请求趋势（最近 50 次，柱高=延迟，绿=命中题库）</h2>
      <div class="body">
        <svg id="spark" class="spark" width="100%" height="90" viewBox="0 0 1000 90"></svg>
        <div class="hint">绿柱=题库命中；蓝柱=走大模型；高度代表耗时(ms)，越高越慢。</div>
      </div>
    </div>

    <div class="panel">
      <h2>最近请求</h2>
      <div class="body"><table id="recent"><thead>
        <tr><th>时间</th><th>题目</th><th>来源</th><th>状态</th><th>耗时</th><th>请求ID</th></tr>
      </thead><tbody></tbody></table></div>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    document.getElementById("top").replaceWith(renderTopbar("index.html"));

    async function loadService() {
      const b = document.getElementById("svc-banner");
      try {
        const st = await supervisor("/api/admin/service/status");
        const alive = st.backend_alive;
        // 单一两态主按钮：运行时=红色「停止」，停止时=绿色「启动」
        b.innerHTML = `
          <div class="row" style="margin:0">
            <span>后端服务：<b class="${alive ? "tag trusted" : "tag conflict"}">${alive ? "运行中" : "已停止"}</b></span>
            <span class="muted">端口 ${st.backend_port}${st.uptime_s ? " · 运行 " + st.uptime_s + "s" : ""}</span>
            <span class="spacer" style="flex:1"></span>
            ${alive
              ? `<button class="red sm" onclick="svc('stop')">■ 停止服务</button>
                 <button class="ghost sm" onclick="svc('restart')">↻ 重启</button>`
              : `<button class="green sm" onclick="svc('start')">▶ 启动服务</button>`}
          </div>`;
      } catch (e) {
        b.innerHTML = `<span class="tag conflict">supervisor 未连接</span> <span class="muted">（${CONFIG.SUPERVISOR_BASE}）— 请先启动 supervisor 以使用启停功能。${e.message}</span>`;
      }
    }

    async function svc(action) {
      try { await supervisor("/api/admin/service/" + action, "POST"); }
      catch (e) { alert("操作失败: " + e.message); }
      setTimeout(loadService, 800);
    }

    async function loadData() {
      let d;
      try { d = await api("/api/admin/dashboard"); }
      catch (e) {
        document.getElementById("cards").innerHTML = `<div class="card"><div class="label">连接后端失败</div><div class="value red">!</div><div class="hint">${e.message}</div></div>`;
        return;
      }
      document.getElementById("cards").innerHTML = `
        <div class="card"><div class="label">总请求数</div><div class="value accent">${d.total_requests}</div></div>
        <div class="card"><div class="label">题库命中率</div><div class="value green">${(d.hit_rate * 100).toFixed(1)}%</div></div>
        <div class="card"><div class="label">题库命中数</div><div class="value">${d.store_hits}</div></div>
        <div class="card"><div class="label">题目总数</div><div class="value">${d.questions_total ?? "-"}</div></div>
        <div class="card"><div class="label">调用错误数</div><div class="value red">${d.errors}</div></div>
        <div class="card"><div class="label">平均耗时</div><div class="value">${d.avg_latency_ms} ms</div></div>
        <div class="card"><div class="label">累计 Token</div><div class="value">${d.total_tokens}</div></div>
        <div class="card"><div class="label">预估成本</div><div class="value">$${d.total_cost}</div></div>`;
      drawSpark(d.recent || []);
      // 最近列表
      const recent = await api("/api/admin/logs?limit=12");
      const tbody = document.querySelector("#recent tbody");
      tbody.innerHTML = (recent.items || []).map(r => `
        <tr>
          <td class="muted">${fmtTime(r.created_at)}</td>
          <td>${escapeHtml((r.title || "").slice(0, 40))}</td>
          <td>${r.store_hit ? statusTag("store") : statusTag("llm")}</td>
          <td>${statusTag(r.answer_status)}</td>
          <td class="muted">${r.latency_ms}ms</td>
          <td><a class="mono" href="logs.html?id=${r.request_id}">${(r.request_id || "").slice(0, 10)}</a></td>
        </tr>`).join("") || `<tr><td colspan="6" class="muted">暂无数据</td></tr>`;
    }

    function drawSpark(items) {
      const svg = document.getElementById("spark");
      const W = 1000, H = 90; // viewBox 固定坐标系
      const arr = items.slice().reverse(); // 旧->新
      if (!arr.length) { svg.innerHTML = `<text x="10" y="40" fill="#8fa3c4">暂无数据</text>`; return; }
      const chartH = H - 22; // 底部留 22px 给时间轴
      const max = Math.max(...arr.map(i => i.latency_ms || 1), 1);
      const bw = W / arr.length;
      let parts = "";
      // 柱子
      arr.forEach((it, i) => {
        const h = Math.max(2, ((it.latency_ms || 1) / max) * (chartH - 6));
        const color = it.store_hit ? "#35c07a" : "#4f8cff";
        parts += `<rect x="${(i * bw + 1).toFixed(1)}" y="${(chartH - h).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${h.toFixed(1)}" fill="${color}" opacity="0.85"/>`;
      });
      // 时间轴基线
      parts += `<line x1="0" y1="${chartH}" x2="${W}" y2="${chartH}" stroke="#2a3850" stroke-width="1"/>`;
      // 时间刻度：首、中、末（转成 HH:MM:SS）
      const fmtClock = (iso) => { try { return new Date(iso).toLocaleTimeString("zh-CN", { hour12: false }); } catch { return ""; } };
      const idxs = arr.length > 1 ? [0, Math.floor(arr.length / 2), arr.length - 1] : [0];
      idxs.forEach((idx) => {
        const x = Math.min(W - 4, Math.max(4, idx * bw + bw / 2));
        const anchor = idx === 0 ? "start" : (idx === arr.length - 1 ? "end" : "middle");
        parts += `<text x="${x.toFixed(1)}" y="${H - 6}" fill="#8fa3c4" font-size="10" text-anchor="${anchor}">${fmtClock(arr[idx].created_at)}</text>`;
      });
      // 时间说明
      parts += `<text x="4" y="12" fill="#8fa3c4" font-size="10">最近 ${arr.length} 次请求（时间由左至右）</text>`;
      svg.innerHTML = parts;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    loadService();
    loadData();
    setInterval(loadService, 5000);
    setInterval(loadData, 8000);
  </script>
</body>
</html>
